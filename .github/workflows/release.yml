name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            ext: ""
            archive: tar.gz

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            ext: ""
            archive: tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            ext: ""
            archive: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            ext: ""
            archive: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            ext: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.use_cross
        run: |
          cross build --release --target ${{ matrix.target }} \
            --bin reckon --bin reckon-mcp --bin reckon-seed

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin reckon --bin reckon-mcp --bin reckon-seed

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          NAME="reckon-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp target/${{ matrix.target }}/release/reckon          "dist/$NAME/"
          cp target/${{ matrix.target }}/release/reckon-mcp      "dist/$NAME/"
          cp target/${{ matrix.target }}/release/reckon-seed     "dist/$NAME/"
          cp README.md INSTALL.md                                 "dist/$NAME/"
          cd dist
          tar czf "${NAME}.tar.gz" "$NAME"
          echo "ASSET=${NAME}.tar.gz" >> $GITHUB_ENV

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name }}"
          $NAME = "reckon-${TAG}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$NAME" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/reckon.exe"      "dist/$NAME/"
          Copy-Item "target/${{ matrix.target }}/release/reckon-mcp.exe"  "dist/$NAME/"
          Copy-Item "target/${{ matrix.target }}/release/reckon-seed.exe" "dist/$NAME/"
          Copy-Item "README.md","INSTALL.md"                               "dist/$NAME/"
          Compress-Archive -Path "dist/$NAME" -DestinationPath "dist/${NAME}.zip"
          "ASSET=${NAME}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
